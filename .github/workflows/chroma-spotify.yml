name: Build Spotify + Chroma & Update Repo

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if chroma-state.json already matches chroma.pw
        type: boolean
        default: false
      base_ipa_url:
        description: Use this decrypted Spotify IPA instead of searching the fallback sources
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: chroma-spotify
  cancel-in-progress: false

env:
  # Repository variables (Settings > Secrets and variables > Actions > Variables)
  # Repos tried in order for the newest rootless EeveeSpotify .deb
  EEVEE_REPOS: ${{ vars.EEVEE_REPOS || 'SideloadLabs/EeveeSpotifyReincarnated NotDarkn/EeveePrebuilt' }}
  CHROMA_CHANNEL: ${{ vars.CHROMA_CHANNEL || 'beta' }}
  DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
  # Private repo holding decrypt.day IPAs, filled by the runner on your Mac
  IPA_CACHE_REPO: ${{ vars.IPA_CACHE_REPO || 'wyatt-poole/ipa-cache' }}
  # SideStore installs Spotify as com.spotify.client.<team ID>; the Watch variants are pointed at that
  SIDESTORE_TEAM_ID: ${{ vars.SIDESTORE_TEAM_ID || 'N228KQ7JL6' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: astral-sh/setup-uv@v6

      - name: Install Playwright
        run: |
          pip install --quiet playwright requests
          python -m playwright install --with-deps chromium
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check chroma.pw and fetch base IPA
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IPA_CACHE_TOKEN: ${{ secrets.IPA_CACHE_TOKEN }}
          FORCE_BUILD: ${{ inputs.force }}
          BASE_IPA_URL: ${{ inputs.base_ipa_url || vars.BASE_IPA_URL }}
        run: python scripts/chroma/fetch_ipa.py

      # The newest Chroma needs a Spotify version nobody has: ask the Mac runner (in the
      # private cache repo) to fetch it from decrypt.day once. It re-runs this workflow when done.
      - name: Request IPA from decrypt.day
        if: steps.fetch.outputs.request_decrypt != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.IPA_CACHE_TOKEN }}
          VER: ${{ steps.fetch.outputs.request_decrypt }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::Spotify $VER needed. Set up the IPA cache (README) or pass base_ipa_url."
            exit 0
          fi
          gh workflow run decrypt-day.yml --repo "$IPA_CACHE_REPO" -f spotify_ver="$VER" -f notify_repo="$GITHUB_REPOSITORY"
          echo "::notice::Asked $IPA_CACHE_REPO to fetch Spotify $VER from decrypt.day"

      - name: Patch with Chroma
        if: steps.fetch.outputs.should_build == 'true'
        env:
          CHROMA_VER: ${{ steps.fetch.outputs.chroma_ver }}
        run: node scripts/chroma/patch_chroma.js

      - name: Upload patcher screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patch-error
          path: patch_error.png
          if-no-files-found: ignore

      # Variants are listed in chroma-variants.json; each one gets its own source URL.
      - name: Build variants
        id: build
        if: steps.fetch.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUILD="${{ steps.fetch.outputs.spotify_ver }}.${{ github.run_number }}"
          cp chroma_patched.ipa Spotify-Chroma.ipa
          cp chroma_patched.ipa Spotify-Chroma-Watch.ipa
          if python scripts/chroma/update_repo.py restore-watch base_spotify.ipa Spotify-Chroma-Watch.ipa; then
            if [ -n "$SIDESTORE_TEAM_ID" ]; then
              python scripts/chroma/update_repo.py watch-companion Spotify-Chroma-Watch.ipa "com.spotify.client.$SIDESTORE_TEAM_ID"
            fi
          else
            echo "::warning::Base IPA has no Watch app, so the Watch variants are skipped"
            rm Spotify-Chroma-Watch.ipa
          fi

          # EeveeSpotify is optional: if no .deb is found, only the Eevee variants are skipped.
          tag="" url=""
          for repo in $EEVEE_REPOS; do
            release=$(gh api "repos/$repo/releases/latest" 2>/dev/null) || { echo "$repo: no releases"; continue; }
            url=$(jq -r '[.assets[] | select(.name | test("(iphoneos-arm64|rootless)\\.deb$"))][0].browser_download_url // empty' <<<"$release")
            if [ -n "$url" ]; then tag="$repo@$(jq -r .tag_name <<<"$release")"; break; fi
            echo "$repo: no rootless .deb in latest release"
          done
          if [ -z "$url" ]; then
            echo "::warning::No EeveeSpotify .deb found in: $EEVEE_REPOS. Eevee variants skipped."
          else
            echo "EeveeSpotify $tag: $url"
            curl -fsSL "$url" -o eevee.deb
            uv tool install --with lief "cyan @ git+https://github.com/asdfzxcvbn/pyzule-rw"
            cyan -i Spotify-Chroma.ipa -o Spotify-Chroma-Eevee.ipa -f eevee.deb
            if [ -f Spotify-Chroma-Watch.ipa ]; then
              cyan -i Spotify-Chroma-Watch.ipa -o Spotify-Chroma-Eevee-Watch.ipa -f eevee.deb
            fi
          fi

          for ipa in Spotify-Chroma*.ipa; do
            python scripts/chroma/update_repo.py stamp "$ipa" "$BUILD"
          done
          ls -l Spotify-Chroma*.ipa
          echo "number=$BUILD" >> "$GITHUB_OUTPUT"
          echo "eevee=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release
        id: release
        if: steps.fetch.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          C_VER: ${{ steps.fetch.outputs.chroma_ver }}
          S_VER: ${{ steps.fetch.outputs.spotify_ver }}
          EEVEE_VER: ${{ steps.build.outputs.eevee }}
          BASE_SOURCE: ${{ steps.fetch.outputs.base_source }}
        run: |
          TAG="chroma-${C_VER}-spotify-${S_VER}"
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          NOTES="Spotify ${S_VER} patched with Chroma ${C_VER}.${EEVEE_VER:+ Eevee variants include EeveeSpotify ${EEVEE_VER}.}
          Base IPA from ${BASE_SOURCE}. Build ${{ steps.build.outputs.number }}.

          $(sha256sum Spotify-Chroma*.ipa)"
          gh release create "$TAG" Spotify-Chroma*.ipa --title "Chroma ${C_VER} for Spotify ${S_VER}" --notes "$NOTES" --latest
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update chroma-state.json and feeds
        if: steps.fetch.outputs.should_build == 'true'
        env:
          C_VER: ${{ steps.fetch.outputs.chroma_ver }}
          S_VER: ${{ steps.fetch.outputs.spotify_ver }}
        run: |
          jq -n --arg c "$C_VER" --arg s "$S_VER" '{chroma: $c, spotify: $s}' > chroma-state.json
          python scripts/chroma/update_repo.py "${{ steps.release.outputs.tag }}" "$S_VER" "$C_VER" "$GITHUB_REPOSITORY" \
            --build "${{ steps.build.outputs.number }}" \
            --newest "${{ steps.fetch.outputs.newest }}" ${{ steps.build.outputs.eevee && format('--eevee "{0}"', steps.build.outputs.eevee) || '' }}

      - name: Update README supported versions
        if: steps.fetch.outputs.should_build == 'true'
        run: |
          TODAY=$(date -u +"%B %-d, %Y")
          sed -i \
            -e "s/| \\*\\*Spotify version\\*\\* | .* |/| **Spotify version** | ${{ steps.fetch.outputs.spotify_ver }} |/" \
            -e "s/| \\*\\*Chroma version\\*\\* | .* |/| **Chroma version** | ${{ steps.fetch.outputs.chroma_ver }} |/" \
            -e "s/| \\*\\*Spotify last built\\*\\* | .* |/| **Spotify last built** | $TODAY |/" \
            README.md

      - name: Commit feed
        if: steps.fetch.outputs.should_build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chroma-state.json apps.json sources README.md
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update: Chroma ${{ steps.fetch.outputs.chroma_ver }} for Spotify ${{ steps.fetch.outputs.spotify_ver }}"
          git pull --rebase origin main
          git push origin HEAD:main
