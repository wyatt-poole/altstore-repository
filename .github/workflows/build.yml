name: Build YouMod IPA & Update Repo

on:
  push:
    branches: [main]
    paths:
      - 'config.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YouMod IPA & Update Repo
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read config
        id: cfg
        run: |
          YT_URL=$(python3 -c "import re; line=open('config.yml').read(); print(re.search(r'youtube_ipa_url:\s*[\"\'](.*?)[\"\']', line).group(1))")
          YT_VER=$(python3 -c "import re; line=open('config.yml').read(); print(re.search(r'youtube_version:\s*[\"\'](.*?)[\"\']', line).group(1))")
          echo "yt_url=$YT_URL" >> $GITHUB_OUTPUT
          echo "yt_ver=$YT_VER" >> $GITHUB_OUTPUT
          echo "tag=v$YT_VER" >> $GITHUB_OUTPUT
          echo "Detected YouTube version: $YT_VER"
          echo "IPA URL: $YT_URL"

      - name: Download and Validate IPA
        run: |
          wget "${{ steps.cfg.outputs.yt_url }}" --quiet --no-verbose -O youtube.ipa
          file_type=$(file --mime-type -b youtube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: not a valid IPA. Got: $file_type"
            exit 1
          fi
          echo "Downloaded: $(ls -lh youtube.ipa)"

      - name: Get YouTube Version from IPA
        run: |
          unzip -q youtube.ipa -d ytextracted
          echo "YT_VERSION=$(grep -A 1 '<key>CFBundleVersion</key>' ytextracted/Payload/YouTube.app/Info.plist | grep '<string>' | awk -F'[><]' '{print $3}')" >> $GITHUB_ENV

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH Environment Variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Clone Theos
        run: git clone --quiet --depth=1 --recurse-submodules https://github.com/theos/theos.git

      - name: Download iOS SDK
        run: |
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS18.6.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      # Private frameworks (e.g. Preferences) are not linkable out of the box any more:
      #   * Theos only passes -F<SDK>/System/Library/PrivateFrameworks to the compiler and
      #     leaves it to ld64 to find them at link time.
      #   * Current Xcode iOS SDKs ship no System/Library/PrivateFrameworks at all, and
      #     ld64 no longer auto-searches it.
      # So add the Theos SDKs this workflow downloads (e.g. 18.6) to the linker search
      # paths, mirroring what Theos does for the compiler.
      - name: Patch Theos private framework linker paths
        run: |
          RULES="$THEOS/makefiles/instance/rules.mk"
          LINE='_THEOS_INTERNAL_LDFLAGS += $(foreach path,$(_THEOS_INTERNAL_SEARCHPATHS) $(wildcard $(THEOS_SDKS_PATH)/*.sdk/System/Library/PrivateFrameworks),$(if $(path),-F$(path)))'
          grep -qF "$LINE" "$RULES" || printf '\n%s\n' "$LINE" >> "$RULES"
          tail -2 "$RULES"

      - name: Install cyan
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          pipx inject cyan lief

      - name: Clone YouTubeHeader and PSHeader
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git $THEOS/include/YouTubeHeader
          cp -r $THEOS/include/YouTubeHeader $THEOS/include/YTHeaders
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git $THEOS/include/PSHeader

      # YouMod (2.x) does `#import <roothide.h>` unconditionally in Files/Headers.h.
      # roothide.h (plus the roothide/ directory it pulls in) ships with roothide/theos
      # under vendor/include, so plain theos/theos does not have it. Drop it into
      # $THEOS/include, which is searched before vendor/include.
      # Pinned to a commit so an upstream rewrite cannot silently break the build.
      - name: Install RootHide headers (roothide.h)
        run: |
          git clone --quiet https://github.com/roothide/headers.git /tmp/roothide-headers
          cd /tmp/roothide-headers
          git checkout --quiet e1132e2bbc3ca15c50e2311bcd349cb7353409e1
          cp -f roothide.h "$THEOS/include/"
          cp -R roothide "$THEOS/include/"
          ls -l "$THEOS/include/roothide.h" "$THEOS/include/roothide/"

      # ── Tweak sources ──────────────────────────────────────────────────────
      - name: Clone YouMod
        run: git clone --quiet --depth=15 -b pre-release https://github.com/Tonwalter888/YouMod.git

      # YTUHD is a YTVideoOverlay plugin: ReloadVideo.x imports ../YTVideoOverlay/Init.x
      # and its %ctor calls into YTVideoOverlay, so the sources must sit side by side and
      # YTVideoOverlay.dylib has to be loaded at runtime (otherwise YTUHD crashes on load).
      - name: Clone YTVideoOverlay
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git

      - name: Clone YTUHD
        run: git clone --quiet --depth=1 https://github.com/Tonwalter888/YTUHD.git

      - name: Clone Return-YouTube-Dislikes
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git

      - name: Clone DontEatMyContent
        run: git clone --quiet --depth=1 https://github.com/therealFoxster/DontEatMyContent.git

      # Safari extension that redirects YouTube links to the app (same one YTLite bundles)
      - name: Get Open in YouTube Safari extension
        run: |
          git clone --quiet https://github.com/BillyCurtis/OpenYouTubeSafariExtension.git /tmp/oyse
          git -C /tmp/oyse checkout --quiet f892c955b7fcea42a783d64526a27dd3fa885e0c
          cp -R /tmp/oyse/OpenYouTubeSafariExtension.appex ${{ github.workspace }}/

      - name: Build YouMod
        run: |
          cd YouMod
          # Pre-release builds: tag each build with version + commit so every commit is a new release
          VER=$(grep '^Version:' control | cut -d ' ' -f2 | tr -d '\r')
          echo "YOUMOD_VERSION=${VER}-$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youmod.deb

      # Runtime dependency of YTUHD (see the Clone YTUHD note above).
      - name: Build YTVideoOverlay
        run: |
          cd YTVideoOverlay
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytvo.deb

      - name: Get YouMod changelog
        run: |
          # Latest pre-release commits (the branch has no release notes)
          CHANGELOG=$(cd YouMod && git log -10 --no-merges --format='- %s')
          echo "YOUMOD_CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "Recent pre-release commits:" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build YTUHD
        run: |
          cd YTUHD
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytuhd.deb

      - name: Build Return-YouTube-Dislikes
        run: |
          cd Return-YouTube-Dislikes
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ryd.deb

      - name: Build DontEatMyContent
        run: |
          cd DontEatMyContent
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/demc.deb

      - name: List built debs
        run: ls -lh ${{ github.workspace }}/*.deb

      # ── Inject ─────────────────────────────────────────────────────────────
      - name: Inject Tweaks Into IPA
        run: |
          cd ${{ github.workspace }}
          tweaks="OpenYouTubeSafariExtension.appex"
          for f in *.deb; do
            tweaks="$tweaks $f"
          done
          echo "Injecting: $tweaks"
          cyan -i youtube.ipa \
               -o "YouMod_${{ env.YOUMOD_VERSION }}_${{ steps.cfg.outputs.yt_ver }}_${{ github.run_number }}.ipa" \
               -uwf $tweaks \
               -n "YouTube" \
               -b com.google.ios.youtube

      # Give each build a unique CFBundleVersion so SideStore sees a new commit as an update
      - name: Set IPA build number
        run: |
          cd ${{ github.workspace }}
          IPA="YouMod_${{ env.YOUMOD_VERSION }}_${{ steps.cfg.outputs.yt_ver }}_${{ github.run_number }}.ipa"
          BUILD_NUM="${{ steps.cfg.outputs.yt_ver }}.${{ github.run_number }}"
          rm -rf ipa_tmp && mkdir ipa_tmp && cd ipa_tmp
          unzip -q "../$IPA"
          PLIST=$(ls -d Payload/*.app)/Info.plist
          # SideStore only re-IDs extensions in PlugIns/, not ExtensionKit ones in Extensions/,
          # so those fail to install ("Mismatched bundle IDs"). YouTube's only one is
          # AppMigrationExtension (device-transfer data), so drop the folder.
          rm -rf Payload/*.app/Extensions
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "$PLIST"
          rm "../$IPA" && zip -qry "../$IPA" .
          cd .. && rm -rf ipa_tmp
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV

      - name: Get IPA size
        id: size
        run: |
          SIZE=$(stat -f%z "${{ github.workspace }}/YouMod_${{ env.YOUMOD_VERSION }}_${{ steps.cfg.outputs.yt_ver }}_${{ github.run_number }}.ipa")
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      # ── Release ────────────────────────────────────────────────────────────
      - name: Upload IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.YOUMOD_VERSION }}
          name: "YouMod ${{ env.YOUMOD_VERSION }}"
          body: |
            Auto-updated YouMod IPA for YouTube ${{ steps.cfg.outputs.yt_ver }}
            YouMod version: ${{ env.YOUMOD_VERSION }}
            Built by GitHub Actions run ${{ github.run_id }}
          files: ${{ github.workspace }}/YouMod_${{ env.YOUMOD_VERSION }}_${{ steps.cfg.outputs.yt_ver }}_${{ github.run_number }}.ipa
          make_latest: true
          prerelease: false

      # ── AltStore repo update ────────────────────────────────────────────────
      - name: Update AltStore repo JSON
        run: |
          export TODAY=$(date -u +%Y-%m-%d)
          export YT_VER="${{ steps.cfg.outputs.yt_ver }}"
          export YOUMOD_VERSION="${{ env.YOUMOD_VERSION }}"
          export IPA_NAME="YouMod_${{ env.YOUMOD_VERSION }}_${{ steps.cfg.outputs.yt_ver }}_${{ github.run_number }}.ipa"
          export BUILD_NUM="${{ env.BUILD_NUM }}"
          export SIZE="${{ steps.size.outputs.size }}"
          REPO_USER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          export DOWNLOAD_URL="https://github.com/$REPO_USER/$REPO_NAME/releases/download/v$YOUMOD_VERSION/$IPA_NAME"
      
          python3 << 'PYEOF'
          import json, os
      
          yt_ver     = os.environ.get('YT_VER', '')
          youmod_ver = os.environ.get('YOUMOD_VERSION', '')
          today      = os.environ.get('TODAY', '')
          download   = os.environ.get('DOWNLOAD_URL', '')
          build_num  = os.environ.get('BUILD_NUM', '')
          size       = int(os.environ.get('SIZE', 0))
          changelog  = os.environ.get('YOUMOD_CHANGELOG', '').strip()
      
          description = f"YouTube {yt_ver} + YouMod v{youmod_ver}\n\n{changelog}" if changelog else f"Auto-built from YouTube {yt_ver} with YouMod v{youmod_ver}"
      
          with open('apps.json') as f:
              data = json.load(f)
      
          versions = data['apps'][0]['versions']
          version_key = yt_ver
      
          new_version = {
              'version': version_key,
              'buildVersion': build_num,
              'date': today,
              'localizedDescription': description,
              'downloadURL': download,
              'size': size,
              'minOSVersion': '14.0'
          }
      
          # Rebuilds of one commit share a release; each has its own file, but drop any entry
          # that points at the same URL so no entry's build number can mismatch its file.
          versions = [v for v in versions if v.get('downloadURL') != download]
          versions.insert(0, new_version)
          data['apps'][0]['versions'] = versions[:5]
      
          with open('apps.json', 'w') as f:
              json.dump(data, f, indent=2)
      
          print(f'apps.json updated: {version_key}')
          PYEOF

      - name: Update README supported versions
        run: |
          TODAY=$(date -u +"%B %-d, %Y")
          YT_VER="${{ steps.cfg.outputs.yt_ver }}"
          YOUMOD_VER="${{ env.YOUMOD_VERSION }}"

          sed -i "" \
            -e "s/| \*\*YouTube version\*\* | .* |/| **YouTube version** | $YT_VER |/" \
            -e "s/| \*\*YouMod version\*\* | .* |/| **YouMod version** | $YOUMOD_VER |/" \
            -e "s/| \*\*Last built\*\* | .* |/| **Last built** | $TODAY |/" \
            README.md

      - name: Commit updated apps.json and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json README.md
          git commit -m "Auto-update: YouMod ${{ env.YOUMOD_VERSION }} for YouTube ${{ steps.cfg.outputs.yt_ver }}"
          git pull --rebase origin main
          git push
