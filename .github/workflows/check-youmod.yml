name: Check for new YouMod pre-release commit

on:
  schedule:
    - cron: '0 */2 * * *'  # every 2 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    name: Check YouMod release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get YouMod pre-release version and commit
        id: youmod
        run: |
          VER=$(curl -sSf "https://raw.githubusercontent.com/Tonwalter888/YouMod/pre-release/control" \
            | grep '^Version:' | cut -d ' ' -f2 | tr -d '\r')
          SHA=$(git ls-remote https://github.com/Tonwalter888/YouMod.git refs/heads/pre-release | cut -c1-7)
          echo "latest=${VER}-${SHA}" >> $GITHUB_OUTPUT
          echo "Pre-release YouMod: ${VER}-${SHA}"

      # Build publishes a release tagged v<version>-<commit>; if it's missing, build it.
      - name: Check whether this commit was already built
        id: built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.youmod.outputs.latest }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger build workflow
        if: steps.built.outputs.exists != 'true'
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Build dispatched for v${{ steps.youmod.outputs.latest }}."

      - name: No update needed
        if: steps.built.outputs.exists == 'true'
        run: echo "v${{ steps.youmod.outputs.latest }} already built - nothing to do."
